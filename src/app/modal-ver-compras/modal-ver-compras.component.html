<h2 mat-dialog-title>Compras</h2>
<mat-dialog-content>
  <table class="table">
    <thead>
      <tr>
        <th>Descripción</th>
        <th>Radicado</th>
        <th>Fecha Solicitud</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let compra of data.compras">
        <td>{{ compra.Descripcion}}</td>
        <td>{{ compra.Radicado }}</td>
        <td>{{ compra.Fecha_compra | date:'dd/MM/yyyy' }}</td>
        <td>{{ compra.Estado_compra }}</td>
      </tr>
    </tbody>
  </table>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cerrar()">Cerrar</button>
</mat-dialog-actions>
