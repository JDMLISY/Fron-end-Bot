<div class="busqueda-container">
  <mat-form-field appearance="outline">
    <mat-label>Buscar por nombre o cédula</mat-label>
    <input
      matInput
      [(ngModel)]="searchValue"
      (keyup)="applyFilter($event)"
      placeholder="Ej: Sara o 123456789"
    />
    <button *ngIf="searchValue" matSuffix mat-icon-button (click)="clearFilter()">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
</div>

<div class="tabla-container mat-elevation-z2">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>

    <!-- Columna Nombre -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let element">{{ element.Nombre }}</td>
    </ng-container>

    <!-- Columna Cédula -->
    <ng-container matColumnDef="Cedula">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Cédula</th>
      <td mat-cell *matCellDef="let element">{{ element.Cedula }}</td>
    </ng-container>

    <!-- Columna Compras -->
    <ng-container matColumnDef="Compras">
      <th mat-header-cell *matHeaderCellDef>Pendientes</th>
      <td mat-cell *matCellDef="let element">
        <button mat-button color="primary" (click)="verCompras(element)">Ver compras</button>
      </td>
    </ng-container>

    <!-- Columna Cupos -->
    <ng-container matColumnDef="cupos">
      <th mat-header-cell *matHeaderCellDef>Ver Cupos</th>
      <td mat-cell *matCellDef="let element">
        <button mat-button color="primary" (click)="verCuposComercio(element)">Ver Cupos</button>
      </td>
    </ng-container>

    <!-- Columna Actualizar -->
    <ng-container matColumnDef="actualizar">
      <th mat-header-cell *matHeaderCellDef>Actualizar</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="accent" (click)="actualizar(element)">
          <mat-icon>refresh</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Columna Contactar -->
    <ng-container matColumnDef="contactar">
      <th mat-header-cell *matHeaderCellDef>Contactar</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="warn" (click)="contactar(element)">
          <mat-icon>chat</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Header y Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
</div>
